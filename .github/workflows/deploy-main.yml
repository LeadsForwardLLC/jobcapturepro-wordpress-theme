name: Deploy main to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-siteground-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy theme with rsync
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p ${SSH_PORT}" \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Purge WordPress and SiteGround caches
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          WP_ROOT="$(dirname "$(dirname "$(dirname "${REMOTE_PATH%/}")")")"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${WP_ROOT}' && set -x && \
              wp sg purge && \
              wp sg purge 'https://jobcapturepro.com/case-study/' && \
              wp sg purge 'https://jobcapturepro.com/case-study' && \
              wp eval '
                \$urls = array(
                  \"https://jobcapturepro.com/case-study/\",
                  \"https://jobcapturepro.com/case-study\",
                  home_url(\"/case-study/\"),
                  home_url(\"/case-study\"),
                );
                if (function_exists(\"sg_cachepress_purge_cache\")) {
                  foreach (\$urls as \$u) { sg_cachepress_purge_cache(\$u); echo \"purged \$u\\n\"; }
                  sg_cachepress_purge_cache();
                  echo \"purged all\\n\";
                }
                // Exclude case-study from Dynamic Cache so campaign HTML cannot stick.
                \$opt = \"siteground_optimizer_excluded_urls\";
                \$list = get_option(\$opt, array());
                if (!is_array(\$list)) { \$list = array(); }
                foreach (array(\"/case-study/\", \"/case-study\") as \$path) {
                  if (!in_array(\$path, \$list, true)) { \$list[] = \$path; }
                }
                update_option(\$opt, \$list);
                echo \"excluded: \" . implode(\",\", \$list) . \"\\n\";
                // Touch page 2049 so SG autoflush also fires.
                if (get_post(2049)) {
                  wp_update_post(array(\"ID\" => 2049, \"post_modified\" => current_time(\"mysql\"), \"post_modified_gmt\" => current_time(\"mysql\", 1)));
                  clean_post_cache(2049);
                  echo \"touched post 2049\\n\";
                }
              ' && \
              (wp cache flush || true)"
          sleep 3
          # Verify canonical URL is no longer a stale HIT.
          for i in 1 2 3 4 5; do
            curl -fsS -D /tmp/jcp-cs.hdr -o /tmp/jcp-case-study.html -A 'JCP-Deploy-Purge' "https://jobcapturepro.com/case-study/" || true
            echo "--- attempt $i ---"
            tr -d '\r' < /tmp/jcp-cs.hdr | grep -iE 'x-proxy-cache:|x-jcp-cache:' || true
            if grep -q 'jcp-fluent-quote-modal--takeover' /tmp/jcp-case-study.html; then
              echo 'OK: modal takeover present on /case-study/'
              break
            fi
            echo 'WARN: still missing modal takeover'
            sleep 2
          done
          grep -E 'jcp-form-modal|data-jcp-form-display' /tmp/jcp-case-study.html | head -5 || true
          if ! grep -q 'jcp-fluent-quote-modal--takeover' /tmp/jcp-case-study.html; then
            echo 'ERROR: /case-study/ still serving stale HTML after purge attempts'
            exit 1
          fi
