name: Deploy main to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-siteground-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # SiteGround SSH can flake on keyscan; retry, then fall back to accept-new.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/jcp-keyscan.err; then
              echo "ssh-keyscan ok (attempt $i)"
              break
            fi
            echo "ssh-keyscan attempt $i failed:"
            cat /tmp/jcp-keyscan.err || true
            sleep $((i * 2))
          done
          if ! grep -q "${{ secrets.SSH_HOST }}" ~/.ssh/known_hosts 2>/dev/null; then
            echo "WARN: known_hosts empty after retries; rsync will use accept-new"
          fi

      - name: Deploy theme with rsync
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${SSH_PORT}" \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Purge WordPress and SiteGround caches
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          WP_ROOT="$(dirname "$(dirname "$(dirname "${REMOTE_PATH%/}")")")"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${WP_ROOT}' && wp eval '
              echo \"plugins: \";
              if (function_exists(\"get_plugins\")) {
                require_once ABSPATH . \"wp-admin/includes/plugin.php\";
              }
              foreach (array(\"sg_cachepress_purge_cache\", \"sg_cachepress_purge_everything\") as \$fn) {
                echo \$fn . \": \" . (function_exists(\$fn) ? \"yes\" : \"no\") . \"\\n\";
              }
              if (function_exists(\"jcp_migrate_contact_page_to_support\")) {
                delete_option(\"jcp_support_page_migrated\");
                jcp_migrate_contact_page_to_support();
                echo \"migrated contact→support\\n\";
              }
              if (function_exists(\"jcp_niche_retire_home_preview\")) {
                \$hid = jcp_niche_retire_home_preview();
                echo \"retired home-preview id=\$hid\\n\";
              }
              if (function_exists(\"jcp_niche_seed_contractor_demo\")) {
                \$cid = jcp_niche_seed_contractor_demo(true);
                update_option(\"jcp_contractor_demo_seed_version\", \"25\");
                update_option(\"jcp_niche_contractor_demo_seeded\", \"1\");
                echo \"reseeded contractor-demo id=\$cid\\n\";
              }
              if (function_exists(\"jcp_page_seed_home\")) {
                \$hid = jcp_page_seed_home(true);
                update_option(\"jcp_home_seed_version\", \"2\");
                echo \"reseeded homepage id=\$hid\\n\";
              }
              \$urls = array(
                home_url(\"/case-study/\"),
                home_url(\"/case-study\"),
                \"https://jobcapturepro.com/case-study/\",
                \"https://jobcapturepro.com/case-study\",
                home_url(\"/\"),
                \"https://jobcapturepro.com/\",
                home_url(\"/contractor-demo/\"),
                home_url(\"/contractor-demo\"),
                \"https://jobcapturepro.com/contractor-demo/\",
                \"https://jobcapturepro.com/contractor-demo\",
                home_url(\"/support/\"),
                home_url(\"/support\"),
                home_url(\"/contact/\"),
                home_url(\"/contact\"),
                \"https://jobcapturepro.com/support/\",
                \"https://jobcapturepro.com/contact/\",
              );
              if (function_exists(\"sg_cachepress_purge_cache\")) {
                foreach (\$urls as \$u) {
                  sg_cachepress_purge_cache(\$u);
                  echo \"purged \$u\\n\";
                }
                sg_cachepress_purge_cache();
                echo \"purged all\\n\";
              } else {
                echo \"WARN: sg_cachepress_purge_cache missing — flush Dynamic Cache in Site Tools\\n\";
              }
              \$opt = \"siteground_optimizer_excluded_urls\";
              \$list = get_option(\$opt, array());
              if (!is_array(\$list)) { \$list = array(); }
              foreach (array(\"/case-study/\", \"/case-study\", \"/contractor-demo/\", \"/contractor-demo\", \"/support/\", \"/support\", \"/contact/\", \"/contact\", \"/\") as \$path) {
                if (!in_array(\$path, \$list, true)) { \$list[] = \$path; }
              }
              update_option(\$opt, \$list);
              echo \"excluded: \" . implode(\",\", \$list) . \"\\n\";
              if (get_post(2049)) {
                wp_update_post(array(
                  \"ID\" => 2049,
                  \"post_modified\" => current_time(\"mysql\"),
                  \"post_modified_gmt\" => current_time(\"mysql\", 1),
                ));
                clean_post_cache(2049);
                echo \"touched post 2049\\n\";
              }
              if (function_exists(\"wp_cache_flush\")) { wp_cache_flush(); }
            ' && (wp cache flush || true)"
          sleep 3
          OK=0
          for i in 1 2 3 4 5; do
            curl -fsS -D /tmp/jcp-cs.hdr -o /tmp/jcp-case-study.html -A 'JCP-Deploy-Purge' "https://jobcapturepro.com/case-study/" || true
            echo "--- attempt $i ---"
            tr -d '\r' < /tmp/jcp-cs.hdr | grep -iE 'x-proxy-cache:|x-jcp-cache:' || true
            if grep -q 'jcp-fluent-quote-modal--takeover' /tmp/jcp-case-study.html; then
              echo 'OK: modal takeover present on /case-study/'
              OK=1
              break
            fi
            echo 'WARN: still missing modal takeover'
            sleep 2
          done
          grep -E 'jcp-form-modal|data-jcp-form-display' /tmp/jcp-case-study.html | head -5 || true
          if [ "$OK" != "1" ]; then
            echo 'ERROR: /case-study/ still serving stale HTML.'
            echo 'Action required: Site Tools → Speed → Caching → Dynamic Cache → Flush Cache'
            # Do not fail the whole deploy — theme files are already live.
            exit 0
          fi
