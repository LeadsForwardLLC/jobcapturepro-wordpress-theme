<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5036" />
    <title>JobCapturePro | Interactive Sales Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="Sales call chapters">
        <a class="brand" href="#" data-go="0" aria-label="JobCapturePro home">
          <img src="assets/jcp-logo-dark.png" alt="JobCapturePro" />
        </a>

        <nav class="chapters" id="chapterNav"></nav>

        <div class="sidebar-foot">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Call workspace saves locally</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <a class="present-brand" href="#" data-go="0" aria-label="JobCapturePro home">
            <img src="assets/jcp-logo-dark.png" alt="JobCapturePro" width="180" height="40" />
          </a>
          <div class="call-meta">
            <label for="prospectName">Prospect</label>
            <input id="prospectName" autocomplete="organization" placeholder="Company name" />
            <span class="save-state" id="saveState">Saved</span>
          </div>
          <div class="top-actions">
            <div class="mode-switch" aria-label="Presentation audience">
              <button data-mode="prospect" type="button">Prospect</button>
              <button data-mode="partner" type="button">Partner</button>
            </div>
            <button class="quiet-btn" id="customizeBtn" type="button">Customize</button>
            <button class="quiet-btn" id="resetBtn" type="button">Reset</button>
            <button class="outline-btn" id="presentBtn" type="button">Present</button>
          </div>
        </header>

        <div class="chapter-stage" id="chapterStage" aria-live="polite"></div>

        <footer class="call-controls">
          <button class="back-btn" id="backBtn" type="button" aria-label="Previous chapter">← <span>Back</span></button>
          <div class="progress-wrap" aria-label="Call progress">
            <span id="progressLabel">01 / 10</span>
            <div class="progress-track"><i id="progressBar"></i></div>
          </div>
          <button class="next-btn" id="nextBtn" type="button"><span>Start the call</span> →</button>
        </footer>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="customizer" id="customizer" aria-label="Presentation settings" aria-hidden="true">
      <div class="customizer-head"><div><span>Presentation setup</span><h2>Make it theirs.</h2></div><button id="closeCustomizer" type="button" aria-label="Close settings">×</button></div>
      <div class="customizer-body">
        <div class="settings-field"><label for="settingProspect">Company or partner</label><input id="settingProspect" type="text" placeholder="Company name" /></div>
        <div class="settings-field"><label for="settingRep">Presented by</label><input id="settingRep" type="text" placeholder="Your name" /></div>
        <div class="settings-field"><label for="settingTrade">Primary trade</label><input id="settingTrade" type="text" placeholder="Roofing, HVAC, foundation repair…" /></div>
        <div class="settings-row"><div class="settings-field"><label for="settingJobs">Jobs / week</label><input id="settingJobs" type="number" min="1" /></div><div class="settings-field"><label for="settingLocations">Locations</label><input id="settingLocations" type="number" min="1" /></div></div>
        <div class="settings-field"><label for="settingLeadLift">Anonymous case verified lead lift</label><div class="suffix-input"><input id="settingLeadLift" type="number" min="0" step="0.1" placeholder="Leave blank until verified" /><span>%</span></div><small>Only enter a figure supported by CRM, GBP, or call-tracking data.</small></div>
        <label class="setting-toggle"><input id="settingPricing" type="checkbox" /><span><i></i></span><strong>Show retail pricing</strong></label>
        <label class="setting-toggle"><input id="settingAcculevel" type="checkbox" checked /><span><i></i></span><strong>Show anonymous Maps case study</strong></label>
      </div>
      <div class="customizer-foot"><button class="next-btn" id="applySettings" type="button"><span>Apply to presentation</span> →</button></div>
    </aside>

    <div class="report-modal" id="reportModal" hidden>
      <button id="closeReport" type="button" aria-label="Close report">×</button>
      <img id="reportImage" alt="Google Maps coverage before and after" />
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
